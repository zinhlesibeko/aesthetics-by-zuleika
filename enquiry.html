<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Send an enquiry to Aesthetics by Zuleika for a makeup booking.">
    <title>Aesthetics by Zuleika | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <a class="brand" href="index.html"><span>Aesthetics</span><small>by Zuleika</small></a>
            <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="services.html">Services</a>
                <a class="active" href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact</a>
                <a class="nav-button" href="enquiry.html">Book Now</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container form-container">
            <p class="eyebrow">BOOKING</p>
            <h1 class="page-title">Make an Enquiry</h1>
            <p class="section-intro">Fill in the form below and I’ll get back to you as soon as possible.</p>

            <form id="enquiryForm" class="enquiry-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="eventType">Event Type</label>
                        <select id="eventType" name="eventType" required>
                            <option value="">Select an event</option>
                            <option value="soft-glam">Soft Glam</option>
                            <option value="full-glam">Full Glam</option>
                            <option value="editorial">Editorial</option>
                            <option value="matric-dance">Matric Dance</option>
                            <option value="bridal">Bridal</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="preferredDate">Preferred Date</label>
                        <input type="date" id="preferredDate" name="preferredDate" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="details">Additional Details</label>
                        <textarea id="details" name="details" rows="6" placeholder="Tell me about your event, location and the look you would like."></textarea>
                    </div>
                </div>

                <button class="button form-button" type="submit">Submit Enquiry</button>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; <span class="current-year"></span> Aesthetics by Zuleika. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
