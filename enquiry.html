<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Makeup Enquiry | Aesthetics by Zuleika</title>
  <meta name="description" content="Enquire about mobile makeup artistry with Aesthetics by Zuleika: soft glam, full glam, editorial, matric dance and bridal makeup at your home.">
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Aesthetics by Zuleika</a>
      <button id="menu-toggle" aria-label="Toggle menu" aria-controls="nav-links">&#9776;</button>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="enquiry.html" aria-current="page">Enquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="enquiry-intro">
      <h1>Tell us about your look</h1>
      <p>Share your event and date and Zuleika will reply with availability and a quote. Makeup is done at your home.</p>
    </section>

    <section class="enquiry-section">
      <form id="enquiry-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>

        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
          <span class="error" id="name-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <span class="error" id="email-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="0821234567" inputmode="numeric" required>
          <span class="error" id="phone-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="event-type">Event type</label>
          <select id="event-type" name="event-type" required>
            <option value="">Select an event type</option>
            <option>Soft Glam (from R650)</option>
            <option>Full Glam (from R850)</option>
            <option>Editorial (from R1,200)</option>
            <option>Matric Dance (from R700)</option>
            <option>Bridal (from R1,800)</option>
          </select>
          <span class="error" id="event-type-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="event-date">Event date</label>
          <input type="date" id="event-date" name="event-date" required>
          <span class="error" id="event-date-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="details">Details</label>
          <textarea id="details" name="details" rows="5" placeholder="Location, number of people, the look you want, skin concerns..." required></textarea>
          <span class="error" id="details-error" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn">Send enquiry</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Aesthetics by Zuleika. All rights reserved.</p>
  </footer>

  <script src="js/scripts.js"></script>
</body>
</html>
